name: CI

on:
  push:
    branches: [main]
    # A release is a signed `app-v<version>` tag. Nothing else ships.
    tags: ["app-v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more, and only release-app does, beside its own
# `permissions:`. Without this every job's GITHUB_TOKEN gets the repository's
# default, which can be write, including in the jobs that run a pull request's code.
permissions:
  contents: read

# Third-party actions are pinned to a commit, with the tag it was resolved from
# beside it: a tag is a pointer its owner can move to new code, and these run in
# jobs holding the Cloudflare token or the right to publish a release.
# attest-build-provenance is GitHub's own, and pinned anyway because it holds
# `id-token: write`. actions/checkout and actions/setup-node ride their major tags.
# To move a pin: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
jobs:
  app:
    name: App
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 because CURRENT_PROJECT_VERSION is the commit count. A
      # shallow clone would silently count only what it fetched and produce a
      # build number that moves on every re-run.
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile

      # The fast gates first: none of them compiles anything, so there is no
      # reason to spend an Xcode build discovering a misformatted file.
      - name: Lint and format (node) 🔍
        run: |
          pnpm lint
          pnpm format:check
      - name: Format (swift) 🔍
        run: make format-swift-check
      - name: Script tests 🧪
        run: pnpm test:scripts
      # A stale Changelog.swift would ship What's New notes that describe a
      # different build than the one they are inside.
      - name: Changelog drift 🔍
        run: make changelog-check
      # The icon bundle and the three menu bar imagesets are generated, and a
      # hand-edited copy builds and ships. appshot comes from its public release at
      # a pinned version, checked against a digest written here rather than the
      # .sha256 published beside it, which whoever could replace the one could
      # replace the other.
      - name: Icon drift 🔍
        env:
          APPSHOT_VERSION: v0.10.0
          APPSHOT_SHA256: 0a83e1a931d0db20bf1989a9aa16e57662c5510d3c0386021e4a18c50678fcea
        run: |
          name="appshot-$APPSHOT_VERSION-macos-universal"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/mgcrea/appshot/releases/download/$APPSHOT_VERSION/$name.tar.gz"
          echo "$APPSHOT_SHA256  $RUNNER_TEMP/$name.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/$name:$PATH" make icon-check
      # The site is built on every push so a broken page fails here, on the pull
      # request, rather than in the deploy job after it has merged. Public assets
      # are LFS pointers in this checkout; Astro copies public/ verbatim, so the
      # build does not need their bytes — the deploy job does, and pulls them.
      # `astro check` first, because Vite strips types without checking them: a type
      # error in a page or in config.ts builds, and deploys.
      - name: Build the website 🌐
        run: |
          pnpm -C apps/website typecheck
          pnpm -C apps/website build
      # The feedback form's failures are runtime-only — a CSP that refuses the
      # Worker, a renamed field, a hidden diagnostic, a slug the Worker would 403.
      # This reads the built page and fails the job on any of them.
      - name: Feedback form wiring 🔍
        run: pnpm -C apps/website run feedback:check
      # The licence Worker's suite runs in the Workers runtime (miniflare) against a
      # local D1, and includes the check that it mints byte-identical keys to
      # scripts/lib/license.mjs — the half of the money loop nothing else tests.
      #
      # The generated Env types are checked first, against .dev.vars.example, which
      # is what worker-configuration.d.ts was generated from, so no real .dev.vars is
      # needed. A binding added to wrangler.jsonc without regenerating would
      # otherwise typecheck against the Env it no longer matches.
      #
      # The `--` is load-bearing: without it pnpm 11 takes `--env-file` as its own
      # and hands it to node, which exits 9 on "node: .dev.vars.example: not found".
      - name: API tests 🧪
        run: |
          pnpm -C apps/api exec -- wrangler types --check --env-file=.dev.vars.example
          pnpm -C apps/api typecheck
          pnpm -C apps/api test
      # The cross-language check, and the one whose failure costs money. JavaScript
      # mints the keys and Swift accepts them, so a disagreement lives between the
      # two, where neither side's own tests can see it. This compiles the real
      # License.swift and runs keys signed with the real signing key through it.
      #
      # Bastion's guard, copied: it needs LICENSE_SIGNING_KEY, which a fork never
      # has, so it skips loudly rather than failing there, and `if:` cannot read
      # `secrets`, so the guard is in the shell. A repository secret if it is set,
      # never an org-wide one: it is the one key that cannot be rotated without
      # refusing every licence ever sold.
      - name: Licence round trip 🔍
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          if [ -z "$LICENSE_SIGNING_KEY" ]; then
            echo "::warning::no LICENSE_SIGNING_KEY secret; skipping the licence round trip"
            exit 0
          fi
          make license-check

      # No signing here: there is no certificate on the runner for this job, and it
      # answers "does it still compile", not "is it shippable". release-app below
      # is the job that signs.
      - name: Build 🏗️
        run: make build XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

      # The app's pure files, compiled beside a check driver with `swiftc` under the
      # app target's own language settings: the transcript parsers, the forecasts, the
      # sort order and the licence refusals, which nothing else exercises. No app, no
      # network, and seconds rather than a build, but after it so a compile error in the
      # app reads as the build failing rather than as a unit check.
      - name: Unit checks (swift) 🧪
        run: make -C apps/apple unit

      # The MCP tool table's suite, against a fake fleet. After the build rather than
      # among the fast gates, because it compiles the package and swift-mcp-kit.
      # `-C apps/apple`, because the root's `make test` also runs the script and
      # Worker suites, which the fast gates above have already run.
      - name: Tests (swift) 🧪
        run: make -C apps/apple test

      # The claim that nothing Armada reads leaves the Mac beyond the opt-in update
      # check, asserted against the bundle that was just built. It depends on
      # `build`, so the same signing flags go with it — without them the target
      # would rebuild with signing on and fail before the audit ever ran.
      - name: Audit the network claim 🔍
        run: make audit XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

  # The app ships as a Developer ID signed, notarized zip attached to a GitHub
  # release, with a Sparkle appcast beside it — never from the website, whose
  # /download, /checksum and /appcast.xml are 302s to
  # releases/latest/download/<asset>. Armada is not an App Store app.
  #
  # Bastion's release-app job, step for step, with cupertino's form of the one
  # place bastion is weaker: the App Store Connect key reaches the script through
  # `env:`, never pasted into the `run:` text, where a secret becomes part of the
  # script GitHub writes to disk and echoes on a syntax error.
  release-app:
    name: Release Armada.app
    runs-on: macos-latest
    needs: [app]
    if: startsWith(github.ref, 'refs/tags/app-v')
    permissions:
      contents: write
      # attest-build-provenance signs the artifact's provenance, so the zip a user
      # downloads can be traced to the workflow run and commit that built it.
      id-token: write
      attestations: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Node only for scripts/changelog-notes.mjs and scripts/verify-update-signature.mjs,
      # neither of which has a dependency.
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      # The tag is authoritative about what ships, and the copies of the version
      # are separate edits in the release commit. Refuse here, where the fix is a
      # commit and a re-tag, rather than after a notarized zip is public and an
      # appcast names a release that does not match the app inside it.
      - name: Resolve version from tag 🔍
        id: version
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} does not carry a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          fail=0
          # Both build configurations, because they are edited by hand.
          marketing=$(grep -c "MARKETING_VERSION = $version;" apps/apple/Armada.xcodeproj/project.pbxproj || true)
          if [ "$marketing" != "2" ]; then
            echo "::error::project.pbxproj has $marketing of 2 configurations at MARKETING_VERSION = $version"
            fail=1
          fi
          site=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' apps/website/src/config.ts)
          if [ "$site" != "$version" ]; then
            echo "::error::apps/website/src/config.ts says APP_VERSION $site, not $version"
            fail=1
          fi
          # The CHANGELOG is a shipped artifact twice over: `make appcast` puts the
          # tag's section in the Sparkle feed, and the release body below is the
          # same section as markdown. A stale heading ships the previous release's
          # notes to everyone deciding whether to install.
          # The first `## [` heading of any kind. Matching only numbered ones read
          # straight past an `## [Unreleased]` left on top, and passed whenever the
          # tag's own section sat below it.
          head=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ "$head" != "$version" ]; then
            echo "::error::the first CHANGELOG section is [$head], not [$version] — is it still [Unreleased]?"
            fail=1
          fi
          if ! grep -q "\`app-v$version\` being the newest" CHANGELOG.md; then
            echo "::error::the CHANGELOG intro line does not name app-v$version as the newest tag"
            fail=1
          fi
          exit $fail

      # macOS 26 is the deployment target and the appcast's minimumSystemVersion,
      # so a runner image without that SDK fails deep inside xcodebuild with
      # nothing pointing at the cause.
      - name: Check the SDK 🔍
        run: |
          xcodebuild -showsdks | grep -E 'macosx2[6-9]' \
            || { echo "::error::no macOS 26+ SDK on this runner image"; exit 1; }

      - name: Import signing certificate 🔑
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt that a
          # runner can never answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # `make sign` falls back to an Apple Development certificate with only a
          # warning. Right on a developer's Mac, wrong here: it would produce a
          # build that cannot notarize, several minutes later.
          security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
            || { echo "::error::no Developer ID Application identity after import"; exit 1; }

      - name: Build, sign and notarize 📦
        env:
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          AC_KEY_P8_BASE64: ${{ secrets.AC_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$AC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_KEY_PATH="$RUNNER_TEMP/ac.p8"
          # CFBundleVersion is the commit count, not github.run_number, so a re-run
          # of the same tag produces the same bytes and the same SHA-256.
          build=$(git rev-list --count HEAD)
          test "$build" -gt 0 2>/dev/null \
            || { echo "::error::could not count commits; is this a shallow clone?"; exit 1; }
          echo "CFBundleVersion=$build (from $(git rev-parse --short HEAD))"
          make build-release \
            XCARGS="MARKETING_VERSION=${{ steps.version.outputs.version }} CURRENT_PROJECT_VERSION=$build"

      # Every claim the download page makes, checked against the artifact that is
      # about to be uploaded rather than against the tree it was built from.
      - name: Verify the artifact 🔍
        run: |
          app="apps/apple/.build/Build/Products/Release/Armada.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          # As an offline machine sees it: proves the ticket was stapled, not
          # merely that notarization was accepted.
          spctl -a -vvv -t install "$app"
          # The network claim, against the signed bundle, with its signed
          # entitlements actually read — the Debug audit in `app` has to skip that.
          make audit-release

      # Bastion's format, not cupertino's: the website serves /checksum raw, so
      # this file has to be the bare digest rather than "<hash>  Armada.zip".
      - name: Checksum 🔢
        working-directory: apps/apple/.build
        run: |
          shasum -a 256 Armada.zip | cut -d' ' -f1 > Armada.zip.sha256
          test "$(wc -c < Armada.zip.sha256)" -eq 65 \
            || { echo "::error::Armada.zip.sha256 is not a bare 64-char digest"; exit 1; }
          cat Armada.zip.sha256

      # After the checksum, and that ordering is load-bearing: `make notarize`
      # re-creates Armada.zip once the ticket is stapled, so both must run after
      # it and describe the same bytes.
      - name: Sign the update 🔏
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast

      - name: Attest provenance 🔏
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          # The feed too: it names the bytes Sparkle will install.
          subject-path: |
            apps/apple/.build/Armada.zip
            apps/apple/.build/appcast.xml

      # The tag's own CHANGELOG section as markdown, from the parse the appcast
      # renders to HTML, so the two are one release described once and neither
      # shows `### Internal`. It exits non-zero on a missing or empty section. The
      # awk this replaced took whichever section came first, Internal and all.
      - name: Release notes 📝
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-notes.mjs --markdown "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # The asset names carry no version on purpose: that is what makes
      # /releases/latest/download/<asset> a permanent URL, which the website's
      # redirects point at. The version lives in the tag.
      - name: Release 🚀
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Armada ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: |
            apps/apple/.build/Armada.zip
            apps/apple/.build/Armada.zip.sha256
            apps/apple/.build/appcast.xml

      - name: Clean up secrets 🧹
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ac.p8" "$RUNNER_TEMP/cert.p12"

  # api.armada.mgcrea.io, on every push to main. `make api-deploy` rather than the
  # pnpm line it wraps, so this and a laptop deploy cannot drift: the recipe refuses
  # on unapplied migrations and curls /health itself.
  deploy-api:
    name: Deploy api
    runs-on: ubuntu-latest
    needs: [app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN in the production environment, not deploying"
            exit 0
          fi
          make api-deploy

  # armada.mgcrea.io, on every push to main. The release itself never needs this:
  # /download, /checksum and /appcast.xml are 302s to releases/latest/download, so a
  # tag publishes without a site deploy.
  #
  # After deploy-api, for the root `deploy` target's reason: the Worker the /buy
  # flow lands on has to be live first, so a failed API deploy holds the site back.
  # A skipped one does not. `needs` alone would skip this job whenever deploy-api
  # was skipped, with nothing in the run saying why, so the condition names what
  # it waits for. A missing Cloudflare token is not a skip: deploy-api warns and
  # succeeds, and this job then warns on its own.
  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: [app, deploy-api]
    if: >-
      ${{ !cancelled()
      && needs.app.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    steps:
      # lfs: true, or the deploy uploads pointer files where the icons and the
      # social card should be, and the site looks fine until someone shares a link.
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install 📦
        run: pnpm install --frozen-lockfile
      # The token is checked in the shell, not in `if:`: the secrets context is not
      # available to a step-level condition, and referencing it there fails the whole
      # workflow at startup. A fork or a repo without the environment skips loudly.
      - name: Deploy 🚀
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN in the production environment, not deploying"
            exit 0
          fi
          make site-deploy
