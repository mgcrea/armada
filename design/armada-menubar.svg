<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Armada — menu bar template, idle</title>
  <!-- Outlined while nothing is working. Black on transparent and rendered as a
       template, so AppKit tints it for light, dark and the menu bar's own
       highlighted state; never give a template image its own colour.

       The water line is bastion's, unchanged and on purpose: these two menu bar
       apps sit inches apart in the same menu bar, and a shared horizon is what
       makes them read as one family rather than two boats. -->
  <g fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18.6 6.4 C22.6 12.6 24.7 20 25.3 27 L18.6 27 Z"/>
    <path d="M16.2 10.6 C13.1 15.6 10.9 21.4 10.2 27 L16.2 27 Z"/>
  </g>
  <path d="M3.5 30.5 Q18 26.1 32.5 30.5" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
</svg>
